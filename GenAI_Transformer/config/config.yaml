# ============================================================
# Text-to-Music: Configuration
# ============================================================

# --- Model ---
model:
  d_model: 512          # 256 → 512
  num_heads: 8          # giữ nguyên (512/8 = 64 dim mỗi head, hợp lý)
  num_layers: 8         # 6 → 8
  d_ff: 2048            # 1024 → 2048
  max_seq_len: 1024     # 2048 → 1024: attention tốn O(n²) nên nhanh ~2.5x,
                        # VRAM giảm mạnh. 1024 token ≈ 85s nhạc, dư cho BGM 30s.
  dropout: 0.1          # giữ
  num_kv_heads: 4
  use_qk_norm: true
  weight_tying: true

# --- Tokenizer ---
tokenizer:
  pitch_range: [21, 108]       # Piano range (A0 to C8)
  velocity_bins: 32
  time_shift_bins: 100          # 10ms per bin, max 1000ms
  tempo_bins: 8
  num_instrument_groups: 16

# --- Prompt (English text → MiniLM freeze + projection) ---
prompt:
  text_model: "sentence-transformers/all-MiniLM-L6-v2"
  max_text_length: 64
  # legacy structured dims kept only for reference / caption templates
  num_moods: 10
  num_genres: 10
  num_scenes: 10
  num_tempos: 5
  num_instruments: 8
  num_energies: 5

# --- Training ---
training:
  batch_size: 64                    # seq 1024 giải phóng VRAM → nạp thẳng 64
  gradient_accumulation_steps: 1    # effective batch vẫn = 64, bỏ được 1 vòng fwd/bwd
  num_epochs: 40                    # vừa khung 2–3 giờ trên V100 (~3-4 phút/epoch)
  learning_rate: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-9
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  label_smoothing: 0.1
  early_stopping_patience: 10
  eval_every: 1
  save_every: 5

# --- Inference ---
inference:
  temperature: 0.85
  top_p: 0.9
  top_k: 50
  max_length: 2048
  default_duration: 30         # seconds

# --- Audio Rendering ---
audio:
  soundfont: "soundfonts/FluidR3_GM.sf2"
  sample_rate: 44100

# --- Paths (shared dataset at Ky3/data) ---
paths:
  data_dir: "../data"
  raw_midi_dir: "../data/raw"
  processed_dir: "../data/processed"
  labels_dir: "../data/labels"
  captions_file: "../data/labels/captions.json"
  checkpoints_dir: "checkpoints"
  outputs_dir: "outputs"
  logs_dir: "logs"
  soundfonts_dir: "soundfonts"

# --- Device ---
device: "auto"                  # "auto", "cuda", "cpu"
seed: 42
